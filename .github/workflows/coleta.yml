name: Coleta PNCP

# Coleta incremental (ver CLAUDE.md, "Atualização contínua"):
#   rápida   a cada 30 min — pega licitação nova e confere pelo /historico as
#            abertas e as em análise ou suspensas que se mexeram nos últimos
#            180 dias. ~1,5 min no Actions.
#   completa todo dia de madrugada — confere todas pelo /historico, inclusive
#            homologadas que ganharam ata ou contrato. ~7 min; 49 min com o
#            PNCP instável.
#   contratos no mesmo job, depois das compras — na rápida só contrato novo;
#            na completa também os vigentes (collector/contratos.py).
#   enriquecer depois da completa — cadastro das empresas na BrasilAPI e
#            sanções dos arquivos do Portal da Transparência. Também sai à
#            mão, com modo "enriquecer".
#
# O repositório é público, então o Actions não tem cota de minutos. O limite
# de tempo de cada job existe para uma rodada presa não correr por horas.
#
# Cron do GitHub é em UTC: Brasília = UTC-3. A completa sai às 6h15 UTC, e
# não às 6h00, para não disputar a vaga com a rápida desse horário: o grupo
# de concorrência só guarda uma rodada na fila, e a mais nova toma o lugar.
#
# O cron do GitHub não é confiável: de 24/09 a 30/09/2026 saíram 4 a 7 das
# ~49 rodadas agendadas por dia, e a completa começava 6 a 7 h atrasada. Por
# isso as rodadas são disparadas de fora, pelo cron-job.org, com
# workflow_dispatch (rápida a cada 30 min, completa às 3h15 de Brasília). O
# token é fine-grained, só Actions deste repositório, e vence em 30/09/2027.
# O cron abaixo fica de reserva.
#
# A rápida sai nos minutos 7 e 37, fora da virada da hora e da meia hora. O
# GitHub descarta disparo agendado quando a fila dele está cheia, e o começo de
# cada hora é o pior momento: com "*/30", em 2026-09-24/25 só 4 de ~40 rodadas
# previstas saíram.

on:
  schedule:
    - cron: "7,37 * * * *" # rápida
    - cron: "15 6 * * *" # completa: 3h15 de Brasília
  workflow_dispatch:
    inputs:
      modo:
        description: "rapida, completa, tudo ou enriquecer (só empresas e sanções)"
        type: choice
        options: [rapida, completa, tudo, enriquecer]
        default: rapida
      limite:
        description: "Máximo de compras por órgão (vazio = todas)"
        required: false
      seco:
        description: "Só relatar, sem gravar"
        type: boolean
        default: false
  push:
    paths: ["collector/**"]

concurrency:
  # Duas coletas ao mesmo tempo disputariam as mesmas linhas.
  group: coleta-pncp
  cancel-in-progress: false

jobs:
  coletar:
    # No push só rodam os testes.
    if: github.event_name != 'push' && inputs.modo != 'enriquecer'
    runs-on: ubuntu-latest
    # Rápida passa de 15 min só com o PNCP degradado; completa e tudo
    # conferem as 1.013 compras.
    timeout-minutes: ${{ (github.event.schedule == '15 6 * * *' || inputs.modo == 'completa' || inputs.modo == 'tudo') && 180 || 15 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Coletar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # O cron das 6h15 é o da rodada completa; o resto é rápida.
          MODO: ${{ inputs.modo || (github.event.schedule == '15 6 * * *' && 'completa' || 'rapida') }}
        # Na rápida, 6 min para conferir histórico; o que sobrar fica para a
        # próxima rodada. O pior caso de uma chamada ao PNCP passa de 4 min,
        # e depois ainda vêm os contratos: o job tem 15.
        run: |
          PRAZO=""
          if [ "$MODO" = rapida ]; then PRAZO="--prazo 6"; fi
          python collector/coleta.py --modo "$MODO" $PRAZO \
            ${{ inputs.limite && format('--limite {0}', inputs.limite) || '' }} \
            ${{ inputs.seco && '--seco' || '' }}

      # Depois das compras, para o contrato achar a licitação que acabou de
      # entrar. Roda mesmo se as compras falharam: a falha de uma fonte não
      # segura a outra. "tudo" não existe aqui; vale como completa.
      - name: Contratos
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODO: ${{ (inputs.modo == 'completa' || inputs.modo == 'tudo' || github.event.schedule == '15 6 * * *') && 'completa' || 'rapida' }}
        run: python collector/contratos.py --modo "$MODO" ${{ inputs.seco && '--seco' || '' }}

  enriquecer:
    # Roda mesmo se a completa falhou: as fontes são outras. Empresa que entrou
    # agora e ficou sem cadastro é pega no dia seguinte. A completa chega pelo
    # cron do GitHub ou disparada de fora (cron-job.org, modo "completa").
    needs: coletar
    if: always() && (github.event.schedule == '15 6 * * *' || inputs.modo == 'completa' || inputs.modo == 'enriquecer')
    runs-on: ubuntu-latest
    # A primeira carga foram ~700 empresas a 1 por segundo; depois, poucas.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Enriquecer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python collector/enriquecimento.py

  testes:
    # Só quando o código do collector muda, não a cada coleta.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: collector/requirements-dev.txt
      - run: pip install -r collector/requirements-dev.txt
      # Os testes usam fixtures gravadas: não tocam rede nem banco.
      - run: python -m pytest collector/tests -q
