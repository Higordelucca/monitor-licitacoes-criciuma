name: Coleta PNCP

# Coleta incremental (ver CLAUDE.md, "Atualização contínua"):
#   rápida   de hora em hora, 7h–20h de Brasília, dias úteis — pega licitação
#            nova e confere pelo /historico as abertas e as em análise ou
#            suspensas que se mexeram nos últimos 180 dias.
#   completa domingo de madrugada — confere todas pelo /historico, inclusive
#            homologadas que ganharam ata ou contrato.
#
# O horário comercial é por causa da cota de minutos do Actions em repositório
# privado. Se o repositório virar público, dá para rodar a rápida a cada 30 min
# o dia todo: trocar o primeiro cron por "*/30 * * * *".
#
# Cron do GitHub é em UTC: Brasília = UTC-3.

on:
  schedule:
    - cron: "0 10-23 * * 1-5" # rápida: 7h às 20h de Brasília, seg–sex
    - cron: "0 6 * * 0" # completa: 3h de Brasília, domingo
  workflow_dispatch:
    inputs:
      modo:
        description: "rapida, completa ou tudo"
        type: choice
        options: [rapida, completa, tudo]
        default: rapida
      limite:
        description: "Máximo de compras por órgão (vazio = todas)"
        required: false
      seco:
        description: "Só relatar, sem gravar"
        type: boolean
        default: false
  push:
    paths: ["collector/**"]

concurrency:
  # Duas coletas ao mesmo tempo disputariam as mesmas linhas.
  group: coleta-pncp
  cancel-in-progress: false

jobs:
  coletar:
    # No push só rodam os testes.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Coletar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # O cron de domingo é o da rodada completa; o resto é rápida.
          MODO: ${{ inputs.modo || (github.event.schedule == '0 6 * * 0' && 'completa' || 'rapida') }}
        run: |
          python collector/coleta.py --modo "$MODO" \
            ${{ inputs.limite && format('--limite {0}', inputs.limite) || '' }} \
            ${{ inputs.seco && '--seco' || '' }}

  testes:
    # Só quando o código do collector muda, não a cada coleta: poupa minutos.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: collector/requirements-dev.txt
      - run: pip install -r collector/requirements-dev.txt
      # Os testes usam fixtures gravadas: não tocam rede nem banco.
      - run: python -m pytest collector/tests -q
