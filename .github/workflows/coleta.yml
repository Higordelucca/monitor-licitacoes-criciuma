name: Coleta PNCP

# Coleta incremental (ver CLAUDE.md, "Atualização contínua"):
#   rápida   a cada 30 min — pega licitação nova e confere pelo /historico as
#            abertas e as em análise ou suspensas que se mexeram nos últimos
#            180 dias. ~2,5 min no Actions.
#   completa todo dia de madrugada — confere todas pelo /historico, inclusive
#            homologadas que ganharam ata ou contrato. 49 min em 2026-09-24, com o
#            PNCP instável.
#
# O repositório é público, então o Actions não tem cota de minutos. O limite
# de tempo de cada job existe para uma rodada presa não correr por horas.
#
# Cron do GitHub é em UTC: Brasília = UTC-3. A completa sai às 6h15 UTC, e
# não às 6h00, para não disputar a vaga com a rápida desse horário: o grupo
# de concorrência só guarda uma rodada na fila, e a mais nova toma o lugar.

on:
  schedule:
    - cron: "*/30 * * * *" # rápida
    - cron: "15 6 * * *" # completa: 3h15 de Brasília
  workflow_dispatch:
    inputs:
      modo:
        description: "rapida, completa ou tudo"
        type: choice
        options: [rapida, completa, tudo]
        default: rapida
      limite:
        description: "Máximo de compras por órgão (vazio = todas)"
        required: false
      seco:
        description: "Só relatar, sem gravar"
        type: boolean
        default: false
  push:
    paths: ["collector/**"]

concurrency:
  # Duas coletas ao mesmo tempo disputariam as mesmas linhas.
  group: coleta-pncp
  cancel-in-progress: false

jobs:
  coletar:
    # No push só rodam os testes.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # Rápida passa de 15 min só com o PNCP degradado; completa e tudo
    # conferem as 1.013 compras.
    timeout-minutes: ${{ (github.event.schedule == '15 6 * * *' || inputs.modo == 'completa' || inputs.modo == 'tudo') && 180 || 15 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Coletar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # O cron das 6h15 é o da rodada completa; o resto é rápida.
          MODO: ${{ inputs.modo || (github.event.schedule == '15 6 * * *' && 'completa' || 'rapida') }}
        run: |
          python collector/coleta.py --modo "$MODO" \
            ${{ inputs.limite && format('--limite {0}', inputs.limite) || '' }} \
            ${{ inputs.seco && '--seco' || '' }}

  testes:
    # Só quando o código do collector muda, não a cada coleta.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: collector/requirements-dev.txt
      - run: pip install -r collector/requirements-dev.txt
      # Os testes usam fixtures gravadas: não tocam rede nem banco.
      - run: python -m pytest collector/tests -q
